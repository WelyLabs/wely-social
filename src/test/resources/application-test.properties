# Placeholder values so the Spring context can start without external services.
#
# This file did not exist: the test profile fell through to application.properties, whose
# ${NEO4J_URI} and friends are injected by Kubernetes and cannot resolve on a build agent. Every
# @SpringBootTest under this profile therefore failed to bind Neo4jProperties before any
# @ServiceConnection had a chance to override them.
spring.application.name=social-test
server.port=0

# Overridden by @ServiceConnection when a container is running; these are only here so the
# properties resolve at all.
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=test-password

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

# No function definition, so Spring Cloud Stream creates no binding and nothing tries to reach a
# broker. Declaring `userCreated` here would make every context test poll an absent Kafka
# indefinitely — which is why SocialApplicationTest is a plain unit test rather than a
# @SpringBootTest.
spring.cloud.function.definition=
spring.cloud.stream.kafka.binder.brokers=localhost:9092

logging.level.root=WARN
