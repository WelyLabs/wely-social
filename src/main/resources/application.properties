spring.application.name=social
server.port=8083

# Production configuration (values injected by Kube)
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# Kafka broker (in the cluster, plaintext)
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVER}


spring.cloud.function.definition=userCreated;userDeleted;userModified
spring.cloud.stream.kafka.binder.auto-create-topics=false

spring.cloud.stream.bindings.userCreated-in-0.destination=USER_CREATED
spring.cloud.stream.bindings.userCreated-in-0.content-type=application/json
spring.cloud.stream.bindings.userCreated-in-0.group=social-service-group
# Create the topic on the broker before deploying: the binder may not create topics.
spring.cloud.stream.bindings.userDeleted-in-0.destination=USER_DELETED
spring.cloud.stream.bindings.userDeleted-in-0.content-type=application/json
spring.cloud.stream.bindings.userDeleted-in-0.group=social-service-group
# A group without a committed offset starts from the oldest deletion, so none is skipped.
spring.cloud.stream.kafka.bindings.userDeleted-in-0.consumer.start-offset=earliest

spring.cloud.stream.bindings.userModified-in-0.destination=USER_MODIFIED
spring.cloud.stream.bindings.userModified-in-0.content-type=application/json
spring.cloud.stream.bindings.userModified-in-0.group=social-service-group

spring.cloud.stream.kafka.binder.producer-properties.acks=all

# Per-record retry of the USER_* consumers, before the record is logged and skipped.
app.consumers.retry.max-retries=5
app.consumers.retry.first-backoff=1s
app.consumers.retry.max-backoff=30s

# --- Account deletion -------------------------------------------------------
# Demo businessIds, comma-separated canonical UUIDs: never kept as a community's last admin nor promoted.
app.account-deletion.protected-user-ids=${ACCOUNT_DELETION_PROTECTED_USER_IDS:}
# Creates the uniqueness constraint on (:DeletedUser) markers at startup, retrying in the background.
app.neo4j.schema-init.enabled=true
app.neo4j.schema-init.first-backoff=1s
app.neo4j.schema-init.max-backoff=5m

# --- Account deletion: reconciliation with wely-users -----------------------
# Pages wely-users' tombstones (GET /user-service/internal/deleted-users) and re-applies the erasure
# to each account not erased here yet, or deleted less than recent-window ago. A blank URL or secret
# makes every pass fail without a call; the service still runs.
app.users-api.url=${USERS_API_URL:}
app.users-api.deleted-users-secret=${DELETED_USERS_READER_SECRET:}

# --- wely-media: community pictures -----------------------------------------
# Keys under communities/ in wely-community-media. The secret defaults to empty so the service
# starts before it is deployed: wely-media then answers 401 and an upload fails with SCL-TEC-004.
app.media-api.url=${MEDIA_API_URL:}
app.media-api.secret=${MEDIA_API_SECRET:}
# Uploads are capped at 10 MB in the controller; this leaves room for the multipart envelope.
spring.webflux.multipart.max-in-memory-size=11MB
app.account-erasure.reconciliation.enabled=${ACCOUNT_ERASURE_RECONCILIATION_ENABLED:true}
app.account-erasure.reconciliation.initial-delay=1m
app.account-erasure.reconciliation.interval=24h
app.account-erasure.reconciliation.retry-interval=1h
app.account-erasure.reconciliation.recent-window=48h
app.account-erasure.reconciliation.page-size=500

# --- Kafka: FRIENDSHIP_CHANGED and FRIENDSHIP_STATE (produced) --------------
# Every change to a pair (request, acceptance, rejection, removal, closeness), for wely-notifications
# and wely-events' friendship projection. Written to a Neo4j outbox in the change's transaction, then
# sent by FriendshipOutboxRelay. Keyed by the pair (ids sorted, joined with ':'), so a pair's records
# stay in order on one partition. The topic must exist beforehand.
spring.cloud.stream.bindings.friendship-out-0.destination=${FRIENDSHIP_TOPIC:FRIENDSHIP_CHANGED}
spring.cloud.stream.bindings.friendship-out-0.content-type=application/json
# A send returns once the broker has acknowledged it, so the relay marks only what Kafka holds.
spring.cloud.stream.kafka.bindings.friendship-out-0.producer.sync=true
# The pair's current friendship, on a compacted topic (cleanup.policy=compact, created beforehand):
# a value after ACCEPTED, CLOSENESS_CHANGED and SNAPSHOT, a tombstone after REMOVED, keyed "a:b".
# A consumer rebuilds every friendship by reading it from the earliest offset.
spring.cloud.stream.bindings.friendship-state-out-0.destination=${FRIENDSHIP_STATE_TOPIC:FRIENDSHIP_STATE}
spring.cloud.stream.bindings.friendship-state-out-0.content-type=application/json
spring.cloud.stream.kafka.bindings.friendship-state-out-0.producer.sync=true
app.friendship-outbox.relay.enabled=${FRIENDSHIP_OUTBOX_RELAY_ENABLED:true}
app.friendship-outbox.relay.poll-interval=2s
app.friendship-outbox.relay.batch-size=100
# A record failing this many times in a row, or once with a permanent error, is parked: never sent.
app.friendship-outbox.relay.max-attempts=20
# After a failed pass the next one waits twice as long, up to this.
app.friendship-outbox.relay.max-backoff=5m
# Published and parked records are deleted after the retention period; pending ones never are.
app.friendship-outbox.purge.interval=1h
app.friendship-outbox.purge.retention=7d
app.friendship-outbox.purge.batch-size=10000
# Gauge wely.outbox.pending{outbox="friendship"}: the pending records, counted every refresh-interval.
app.friendship-outbox.backlog.enabled=true
app.friendship-outbox.backlog.refresh-interval=30s
# One SNAPSHOT record per accepted pair, once per name (marker: (:Migration {name: <snapshot-name>})).
# A new name (friendship-snapshot-v3, ...) re-runs it on the next start. v1 ran before FRIENDSHIP_STATE
# existed: v2 fills the state topic with the friendships made before it.
app.friendship-outbox.snapshot.enabled=true
app.friendships.snapshot-name=${FRIENDSHIP_SNAPSHOT_NAME:friendship-snapshot-v2}

# Keycloak Hybrid Discovery/Validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}

logging.level.root=INFO
logging.level.com.calendar.social=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.neo4j.driver=WARN

# --- Actuator ---------------------------------------------------------------
# Only health, info and prometheus are exposed. Everything else — env, beans,
# heapdump, loggers — stays off: those endpoints describe the internals and, on a
# cluster without a NetworkPolicy, anything inside can reach them. prometheus
# carries counters such as wely_errors_technical_total{code}, no user data.
management.endpoints.web.exposure.include=health,info,prometheus
# HTTP latency as a few fixed buckets (http_server_requests_seconds_bucket{le=...}) rather than a
# percentile histogram: cheap enough for a Raspberry Pi, enough for a p95 panel.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms,5s
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Splits health into the two groups Kubernetes probes use:
#   /actuator/health/liveness  — is the process broken beyond recovery?
#   /actuator/health/readiness — should it receive traffic?
# Neither includes the database or broker indicators, and that is deliberate: a
# datastore blip would otherwise mark every pod NotReady at once, pulling the
# whole service out of the load balancer instead of degrading.
management.endpoint.health.probes.enabled=true
